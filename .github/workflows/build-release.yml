name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 17
        run: choco install llvm --version=17.0.6 -y

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DLLVM_DIR="C:/Program Files/LLVM/lib/cmake/llvm"

      - name: Build Release
        run: cmake --build build --config Release

      - name: Run tests
        shell: bash
        run: bash tests/run_tests.sh build/Release/chkoupi.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chkoupi-windows-x64
          path: build/Release/chkoupi.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 17
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y llvm-17-dev libllvm17 llvm-17

      - name: Configure CMake
        run: cmake -B build -DLLVM_DIR="/usr/lib/llvm-17/lib/cmake/llvm"

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: bash tests/run_tests.sh build/chkoupi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chkoupi-linux-x64
          path: build/chkoupi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package binaries
        run: |
          cd artifacts/chkoupi-windows-x64 && zip -j ../../chkoupi-windows-x64.zip chkoupi.exe && cd ../..
          cd artifacts/chkoupi-linux-x64 && chmod +x chkoupi && tar czf ../../chkoupi-linux-x64.tar.gz chkoupi && cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            chkoupi-windows-x64.zip
            chkoupi-linux-x64.tar.gz
