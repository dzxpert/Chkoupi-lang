    <text x="45" y="329" fill="#3C4048" text-anchor="end" font-size="12" select="none">13</text>
    <text x="70" y="329" xml:space="preserve"><tspan fill="#E6C387">dir</tspan> <tspan fill="#DCD7BA">greeting</tspan> <tspan fill="#9CABCA">=</tspan> <tspan fill="#98BB6C">&quot;Salam&quot;</tspan> <tspan fill="#9CABCA">+</tspan> <tspan fill="#98BB6C">&quot; Algeria!&quot;</tspan><tspan fill="#DCD7BA">;</tspan></text>
    <text x="45" y="351" fill="#3C4048" text-anchor="end" font-size="12" select="none">14</text>
    <text x="70" y="351" xml:space="preserve"><tspan fill="#7E9CD8">ektb</tspan><tspan fill="#DCD7BA">(</tspan><tspan fill="#98BB6C">&quot;%s (length = %lld)\n&quot;</tspan><tspan fill="#DCD7BA">,</tspan> <tspan fill="#DCD7BA">greeting</tspan><tspan fill="#DCD7BA">,</tspan> <tspan fill="#7E9CD8">tool</tspan><tspan fill="#DCD7BA">(</tspan><tspan fill="#DCD7BA">greeting</tspan><tspan fill="#DCD7BA">)</tspan><tspan fill="#DCD7BA">)</tspan><tspan fill="#DCD7BA">;</tspan></text>
