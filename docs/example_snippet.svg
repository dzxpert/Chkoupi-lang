    <text x="45" y="461" fill="#3C4048" text-anchor="end" font-size="12" select="none">19</text>
    <text x="70" y="461" xml:space="preserve"><tspan fill="#7E9CD8">ektb</tspan><tspan fill="#DCD7BA">(</tspan><tspan fill="#98BB6C">&quot;nums[1] = %lld\n&quot;</tspan><tspan fill="#DCD7BA">,</tspan> <tspan fill="#DCD7BA">nums</tspan><tspan fill="#DCD7BA">[</tspan><tspan fill="#D27E4E">1</tspan><tspan fill="#DCD7BA">]</tspan><tspan fill="#DCD7BA">)</tspan><tspan fill="#DCD7BA">;</tspan></text>
