    <text x="70" y="153" xml:space="preserve"><tspan fill="#E6C387">dalla</tspan> <tspan fill="#DCD7BA">factorial</tspan><tspan fill="#DCD7BA">(</tspan><tspan fill="#DCD7BA">n</tspan><tspan fill="#9CABCA">:</tspan> <tspan fill="#7CA1F5">tabi3i</tspan><tspan fill="#DCD7BA">)</tspan> <tspan fill="#DCD7BA">{</tspan></text>
    <text x="45" y="175" fill="#3C4048" text-anchor="end" font-size="12" select="none">6</text>
    <text x="70" y="175" xml:space="preserve">    <tspan fill="#E6C387">idha</tspan> <tspan fill="#DCD7BA">(</tspan><tspan fill="#DCD7BA">n</tspan> <tspan fill="#9CABCA">&lt;=</tspan> <tspan fill="#D27E4E">1</tspan><tspan fill="#DCD7BA">)</tspan> <tspan fill="#DCD7BA">{</tspan></text>
    <text x="45" y="197" fill="#3C4048" text-anchor="end" font-size="12" select="none">7</text>
    <text x="70" y="197" xml:space="preserve">        <tspan fill="#E6C387">raja3</tspan> <tspan fill="#D27E4E">1</tspan><tspan fill="#DCD7BA">;</tspan></text>
