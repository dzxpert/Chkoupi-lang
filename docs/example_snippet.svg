    <text x="70" y="417" xml:space="preserve"><tspan fill="#E6C387">dir</tspan> <tspan fill="#DCD7BA">nums</tspan> <tspan fill="#9CABCA">=</tspan> <tspan fill="#DCD7BA">[</tspan><tspan fill="#D27E4E">10</tspan><tspan fill="#DCD7BA">,</tspan> <tspan fill="#D27E4E">20</tspan><tspan fill="#DCD7BA">,</tspan> <tspan fill="#D27E4E">30</tspan><tspan fill="#DCD7BA">]</tspan><tspan fill="#DCD7BA">;</tspan></text>
    <text x="45" y="439" fill="#3C4048" text-anchor="end" font-size="12" select="none">18</text>
