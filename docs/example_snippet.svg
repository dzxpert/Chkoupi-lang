    <text x="70" y="241" xml:space="preserve">    <tspan fill="#E6C387">raja3</tspan> <tspan fill="#DCD7BA">n</tspan> <tspan fill="#9CABCA">*</tspan> <tspan fill="#DCD7BA">factorial</tspan><tspan fill="#DCD7BA">(</tspan><tspan fill="#DCD7BA">n</tspan> <tspan fill="#9CABCA">-</tspan> <tspan fill="#D27E4E">1</tspan><tspan fill="#DCD7BA">)</tspan><tspan fill="#DCD7BA">;</tspan></text>
