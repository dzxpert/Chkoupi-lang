    <text x="45" y="527" fill="#3C4048" text-anchor="end" font-size="12" select="none">22</text>
    <text x="70" y="527" xml:space="preserve"><tspan fill="#E6C387">dir</tspan> <tspan fill="#DCD7BA">result</tspan> <tspan fill="#9CABCA">=</tspan> <tspan fill="#DCD7BA">factorial</tspan><tspan fill="#DCD7BA">(</tspan><tspan fill="#D27E4E">5</tspan><tspan fill="#DCD7BA">)</tspan><tspan fill="#DCD7BA">;</tspan></text>
    <text x="45" y="549" fill="#3C4048" text-anchor="end" font-size="12" select="none">23</text>
    <text x="70" y="549" xml:space="preserve"><tspan fill="#7E9CD8">ektb</tspan><tspan fill="#DCD7BA">(</tspan><tspan fill="#98BB6C">&quot;5! = %lld\n&quot;</tspan><tspan fill="#DCD7BA">,</tspan> <tspan fill="#DCD7BA">result</tspan><tspan fill="#DCD7BA">)</tspan><tspan fill="#DCD7BA">;</tspan></text>
